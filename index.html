  <script>
    // Realistic Trading Candlestick + Trendline Background Animation
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let candles = [];
    const candleWidth = 14;
    const candleGap = 10;

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      generateCandles();
    }

    function generateCandles() {
      candles = [];
      const count = Math.ceil(width / (candleWidth + candleGap)) + 4;
      let price = height * 0.45;

      for (let i = 0; i < count; i++) {
        const change = (Math.random() - 0.48) * (height * 0.14);
        const open = price;
        let close = open + change;

        if (close < height * 0.15) close = height * 0.22;
        if (close > height * 0.82) close = height * 0.72;

        const high = Math.min(open, close) - Math.random() * 28;
        const low = Math.max(open, close) + Math.random() * 28;

        candles.push({ open, close, high, low });
        price = close;
      }
    }

    let offset = 0;
    function drawChart() {
      ctx.clearRect(0, 0, width, height);

      // Subtle Grid Lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      const gridSize = 65;
      for (let x = 0; x < width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y < height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      const step = candleWidth + candleGap;
      offset -= 0.35;
      if (Math.abs(offset) >= step) {
        offset = 0;
        candles.shift();
        const last = candles[candles.length - 1];
        const open = last.close;
        let close = open + (Math.random() - 0.49) * (height * 0.14);
        if (close < height * 0.15) close = height * 0.25;
        if (close > height * 0.82) close = height * 0.70;
        const high = Math.min(open, close) - Math.random() * 25;
        const low = Math.max(open, close) + Math.random() * 25;
        candles.push({ open, close, high, low });
      }

      // Draw Candlesticks
      candles.forEach((c, i) => {
        const x = i * step + offset;
        const isGreen = c.close < c.open;
        const color = isGreen ? '#10b981' : '#ef4444';

        // Wick
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + candleWidth / 2, c.high);
        ctx.lineTo(x + candleWidth / 2, c.low);
        ctx.stroke();

        // Body
        ctx.fillStyle = color;
        const bodyTop = Math.min(c.open, c.close);
        const bodyHeight = Math.max(Math.abs(c.close - c.open), 6);
        ctx.fillRect(x, bodyTop, candleWidth, bodyHeight);
      });

      // Draw White Trendline connecting closes
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      candles.forEach((c, i) => {
        const x = i * step + offset + candleWidth / 2;
        const y = c.close;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      requestAnimationFrame(drawChart);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    drawChart();
  </script>
